version: '3.8'

services:
  portfolio_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-ci-cd
    restart: always
    ports:
      - "80:80"

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node_exporter
    restart: always
    ports:
      - "9100:9100"

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: always
    ports: 
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d' # Max save data for 7 days

  # Grafana
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hellosatyahehe
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
