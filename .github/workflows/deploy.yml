name: Deploy App to AWS EC2 with S3 Backup

on:
   push:
      branches: ["main"]

jobs:
   deploy:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
            node-version: '20'
            cache: 'npm'

         # Install depedencies & Build app
         - name: Install depedencies and build
           run: |
            npm install
            npm run build

         # Compress build result to zip for archive
         - name: Archive build artifacts
           run: |
            zip -r dist.zip dist/

         # Configure AWS Credentials (Make sure IAM User have access to S3 & EC2)
         - name: Configure AWS Credentials
           uses: aws-actions/configure-aws-credentials@v4
           with:
            aws-accress-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ap-southeast-1

         # Upload archive build file to S3 Bucket (Versioned/Timestamped)
         - name: Upload Artifact to S3
           run: |
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            aws s3 cp dist.zip s3://${{ secrets.AWS_S3_BUCKET_NAME }}/releases/dist-$TIMESTAMP.zip
            aws s3 cp dist.zip s3://${{ secrets.AWS_S3_BUCKET_NAME }}/releases/dist-latest.zip

         # Setup SSH Agent to connect to EC2
         - name: Set up SSH Key
           uses: webfactory/ssh-agent@v0.9.0
           with:
            ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
         
         # Adding Known Host securely
         - name: Adding Known Hosts
           run: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            # Scan key from EC2 and make sure it's not empty
            ssh-keyscan -t rsa,ecdsa,ed25519 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts

            # Check if known_hosts is filled or not
            echo "Checking known hosts content:"
            tail -n 5 ~/.ssh/known_hosts

         # Deploy to EC2 with Zero-Downtime use Docker Compose
         - name: Deploy to AWS EC2 via SSH
           uses: appleboy/ssh-action@master
           with:
            host: ${{ secrets.EC2_HOST }}
            username: ubuntu
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
               cd ~/portfolio-vue
               git pull origin main

               # Build & Rolling update container without significant downtime
               sudo docker compose up -d --build --remove-orphans

               # Clear docker image cache that no longer needed
               sudo docker image prune -f