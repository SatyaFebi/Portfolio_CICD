name: Deploy to AWS EC2

on:
   push:
      branches: ["main"]

jobs:
   deploy:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout Code
           uses: actions/checkout@v4
         
         - name: Set up SSH Key
           uses: webfactory/ssh-agent@v0.9.0
           with:
            ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
         
         - name: Adding Known Hosts
           run: |
            mkdir -p ~/.ssh
            ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

         - name: Copy project files to EC2 and Build Docker
           run: |
             ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
             # Create project folder if there is none
             mkdir -p ~/portfolio-vue
             EOF

             # Send project file (except node_modules, .git, dll) to server
             rsync -avz --exclude 'node_modules' --exclude '.git' --exclude 'terraform' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/portfolio-vue/

             ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
               cd ~/portfolio-vue

               # Make sure that the Docker & Docker Compose are active in server
               # Build and re-run Docker container
               sudo docker compose down
               sudo docker compose up --build -d
             EOF